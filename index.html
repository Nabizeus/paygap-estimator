<!DOCTYPE html>

}

    --w:#3aa36a; --m:#a06a2a; --accent:#3987e5; --pos:#3987e5; --neg:#e66767; --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767; --warn-bg:#2e2510; --warn-ink:#f3d58a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --w:#3aa36a; --m:#a06a2a; --accent:#3987e5; --pos:#3987e5; --neg:#e66767; --good:#0ca30c; --bad:#e66767;

<script>// ---- Pay gap calculations (mirror of python/paygap/__init__.py) ----
const PayGap = (() => {
  const DIVISORS = { triangular: Math.sqrt(24), uniform: Math.sqrt(12) };
  const LABELS = ["HiSig", "Sig", "MidSig", "NotSig"];

  function lgamma(x) {
    const c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
      -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    let y = x, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (let j = 0; j < 6; j++) ser += c[j] / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
  }
  function betacf(a, b, x) {
    const tiny = 1e-300, eps = 1e-15;
    const qab = a + b, qap = a + 1, qam = a - 1;
    let c = 1, d = 1 - qab * x / qap;
    d = 1 / (Math.abs(d) > tiny ? d : tiny);
    let h = d;
    for (let m = 1; m < 400; m++) {
      const m2 = 2 * m;
      let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; d = 1 / (Math.abs(d) > tiny ? d : tiny);
      c = 1 + aa / c; c = Math.abs(c) > tiny ? c : tiny;
      h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; d = 1 / (Math.abs(d) > tiny ? d : tiny);
      c = 1 + aa / c; c = Math.abs(c) > tiny ? c : tiny;
      const del = d * c; h *= del;
      if (Math.abs(del - 1) < eps) break;
    }
    return h;
  }
  function betainc(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    if (x < (a + 1) / (a + b + 2)) return bt * betacf(a, b, x) / a;
    return 1 - bt * betacf(b, a, 1 - x) / b;
  }
  // Two-tailed p of Student t (= Excel TDIST(|t|, dof, 2))
  function tP(t, dof) {
    if (!(dof > 0)) return NaN;
    if (!isFinite(t)) return 0;
    return betainc(dof / 2, 0.5, dof / (dof + t * t));
  }
  function label(conf, th) {
    if (conf == null || !isFinite(conf)) return "n/a";
    for (let i = 0; i < 3; i++) if (conf >= th[i]) return LABELS[i];
    return LABELS[3];
  }
  function test(diff, err, dof, th) {
    if (!(err > 0) || !(dof > 0)) return { diff, error: err, t: null, dof, p: null, confidence: null, label: "n/a" };
    const t = diff / err, p = tP(t, dof), conf = 1 - p;
    return { diff, error: err, t, dof, p, confidence: conf, label: label(conf, th) };
  }
  function rel(diff, w, m, ref) {
    const base = ref === "men" ? m : (w + m) / 2;
    return base ? diff / base : null;
  }
  function logFactorials(n) {
    const a = new Float64Array(n + 1);
    for (let i = 2; i <= n; i++) a[i] = a[i - 1] + Math.log(i);
    return a;
  }
  // Two-sided Fisher's exact test for the 2x2 table [[a, b], [c, d]]
  function fisher(a, b, c, d, lf) {
    const r1 = a + b, c1 = a + c, c2 = b + d, N = a + b + c + d;
    if (!lf || lf.length <= N) lf = logFactorials(N);
    const lp = x => lf[c1] - lf[x] - lf[c1 - x] + lf[c2] - lf[r1 - x] - lf[c2 - r1 + x] - (lf[N] - lf[r1] - lf[N - r1]);
    const lo = Math.max(0, r1 - c2), hi = Math.min(r1, c1), obs = lp(a);
    let p = 0;
    for (let x = lo; x <= hi; x++) { const v = lp(x); if (v <= obs + 1e-7) p += Math.exp(v); }
    return Math.min(1, p);
  }
  // EU Pay Transparency style indicators, estimated from band midpoints:
  // mean and median gap relative to men's pay, and women's share per pay quartile.
  function euIndicators(rows, W, M, aw, am) {
    const sorted = rows.filter(r => r.women + r.men > 0).slice().sort((a, b) => a.midpoint - b.midpoint);
    const median = key => {
      const tot = sorted.reduce((a, r) => a + r[key], 0);
      if (!tot) return NaN;
      const half = (tot + 1) / 2; let acc = 0;
      for (const r of sorted) { acc += r[key]; if (acc >= half) return r.midpoint; }
      return NaN;
    };
    const mw = median("women"), mm = median("men");
    const N = W + M, q = [[0, 0], [0, 0], [0, 0], [0, 0]];
    let pos = 0;
    for (const r of sorted) {
      const n = r.women + r.men;
      for (let k = 0; k < 4; k++) {
        const ov = Math.max(0, Math.min(pos + n, (k + 1) * N / 4) - Math.max(pos, k * N / 4));
        q[k][0] += ov * r.women / n; q[k][1] += ov * r.men / n;
      }
      pos += n;
    }
    const meanGap = am ? (aw - am) / am : NaN, medianGap = mm ? (mw - mm) / mm : NaN;
    return { mean_gap: meanGap, median_gap: medianGap, median_women: mw, median_men: mm,
      quartiles: q.map(([w, m]) => ({ women: w, men: m, share_women: w + m ? w / (w + m) : NaN })),
      above_threshold: Math.abs(meanGap) >= 0.05 || Math.abs(medianGap) >= 0.05 };
  }
  const mid = l => (l.mid != null && l.mid !== "" && isFinite(+l.mid)) ? +l.mid : (+l.min + +l.max) / 2;

  /** levels: [{name,min,max,mid?}], women:[n], men:[n] */
  function analyze(levels, women, men, opts = {}) {
    const dist = opts.distribution || "triangular";
    const ref = opts.reference || "mean";
    const th = opts.thresholds || [0.99, 0.95, 0.90];
    const k = DIVISORS[dist];
    let fw = 0, fm = 0, vw = 0, vm = 0, nw = 0, nm = 0;
    const W = levels.reduce((a, _, i) => a + (+women[i] || 0), 0);
    const M = levels.reduce((a, _, i) => a + (+men[i] || 0), 0);
    const lf = logFactorials(W + M), share = W + M ? W / (W + M) : NaN;
    const rows = levels.map((l, i) => {
      const w = +women[i] || 0, m = +men[i] || 0, n = w + m;
      const mp = mid(l), sigma = (+l.max - +l.min) / k;
      const pw = w * mp, pm = m * mp, ew = w * sigma, em = m * sigma;
      fw += pw; fm += pm; vw += ew * ew; vm += em * em; nw += w; nm += m;
      // Representation: women's share at this level vs the rest of staff (Fisher's exact test)
      const testable = n > 0 && n < W + M && W > 0 && M > 0;
      const sw_ = n ? w / n : null, expected = n * share;
      let res = { p: null, confidence: null, label: "n/a" };
      if (testable) {
        const p = fisher(w, m, W - w, M - m, lf), conf = 1 - p;
        res = { p, confidence: conf, label: label(conf, th) };
      }
      const rep = !testable ? null : Math.abs(w - expected) < 0.5 ? "as_expected" : w < expected ? "under" : "over";
      return Object.assign({ level: l.name, women: w, men: m, midpoint: mp, sigma,
        pay_women: pw, pay_men: pm, err_women: ew, err_men: em, testable,
        share_women: sw_, share_overall: share, share_diff: sw_ == null ? null : sw_ - share,
        expected_women: expected, representation: rep }, res);
    });
    const out = { distribution: dist, reference: ref, women: nw, men: nm, levels: rows };
    if (nw === 0 || nm === 0) { out.error = "empty"; return out; }
    const gw = Math.sqrt(vw), gm = Math.sqrt(vm), dof = nw + nm - 2;
    const total = test(fw - fm, Math.hypot(gw, gm), dof, th);
    Object.assign(total, { women: fw, men: fm, err_women: gw, err_men: gm, rel: rel(fw - fm, fw, fm, ref) });
    const aw = fw / nw, am = fm / nm, sw = gw / nw, sm = gm / nm;
    const mean = test(aw - am, Math.hypot(sw, sm), dof, th);
    Object.assign(mean, { women: aw, men: am, err_women: sw, err_men: sm, rel: rel(aw - am, aw, am, ref) });
    const hr = nm / nw, pr = fw ? fm / fw : NaN;
    const rerr = fw && fm ? pr * Math.sqrt((gw / fw) ** 2 + (gm / fm) ** 2) : 0;
    const ratio = test(hr - pr, rerr, dof, th);
    Object.assign(ratio, { headcount_ratio: hr, pay_ratio: pr, excess: pr / hr - 1 });
    // Where the gap comes from: each level's contribution to (women's average - men's average)
    rows.forEach(r => { r.contribution = r.midpoint * (r.women / nw - r.men / nm); });
    const eu = euIndicators(rows, nw, nm, aw, am);
    return Object.assign(out, { total, mean, ratio, eu });
  }
  return { analyze, tP, label, mid, fisher };
})();
if (typeof module !== "undefined") module.exports = PayGap;
</script>
<script>const I18N = {
en: {
  locale: "en-GB",

  method_title: "How it works",
  method_html: `<p>Often only a company's <strong>salary table</strong> (minimum and maximum pay for each level) and the <strong>number of women and men</strong> at each level are known. This app estimates whether pay differs by gender from that information alone.</p>
<ol>
<li><strong>Salary per person.</strong> Everyone at a level is assumed to earn the band midpoint. The uncertainty of that assumption follows the GUM (<em>Guide to the Expression of Uncertainty in Measurement</em>): σ = band width / √24 for a triangular distribution, or / √12 for a uniform one.</li>
<li><strong>Pay per group and level.</strong> N × midpoint, with uncertainty N × σ. People in the same band are treated as fully correlated.</li>
<li><strong>Totals.</strong> Pay is summed over levels and uncertainties are added in quadrature: σ<sub>total</sub> = √Σσ²<sub>level</sub>.</li>
<li><strong>Tests.</strong> Each difference is divided by its combined uncertainty to give a Student t-score, with degrees of freedom = N<sub>women</sub> + N<sub>men</sub> − 2. The two-tailed p-value is the probability of reaching the wrong conclusion (Type I error). Confidence = 1 − p.</li>
<li><strong>Pay share vs headcount.</strong> The ratio of men's to women's total pay is compared with the ratio of their headcounts. If men's share of pay is larger than their share of headcount, men are paid more per person.</li>
<li><strong>Representation by level.</strong> For each level, women's share is compared with their share among all other staff using a two-sided Fisher's exact test, which is reliable even for very small groups. Since everyone at a level is assumed to earn the same midpoint, this shows <em>where</em> a gap in average pay comes from: under-representation in well-paid levels lowers women's average, over-representation raises it.</li>
<li><strong>EU pay transparency indicators.</strong> Following the EU Pay Transparency Directive (2023/970), the mean and median gap are also shown relative to men's pay, together with women's share in each pay quartile (all staff sorted by pay and split into four equal groups). A gap of 5% or more is flagged: from that level the Directive requires employers to justify or correct the gap. Here these values are estimated from band midpoints.</li>
</ol>
<h3>Limits</h3>
<ul>
<li>Average pay here is an estimate based on band midpoints. It can only show a gap caused by how women and men are spread across levels, not differences in pay within a band.</li>
<li>Small groups (fewer than ~5 people) give unreliable results and may make individuals identifiable.</li>
<li>Statistical significance isn't proof of discrimination. It shows the difference is unlikely to be due to chance under these assumptions.</li>
<li>The analysis only looks at pay. A strong headcount imbalance (e.g. fewer than about 30% women, a common rule of thumb for a "critical mass") is worth noting even when pay per person is equal. The under-represented group can be more easily overlooked or not heard, for example in meetings and decisions, and can experience psychological strain such as stress, isolation or pressure to fit in. Salary data can't show these effects.</li>
</ul>
<h3>Sources</h3>
<ol class="src">
<li><a href="https://doi.org/10.59161/JCGM100-2008E" target="_blank" rel="noopener">JCGM 100:2008 — Evaluation of measurement data: Guide to the expression of uncertainty in measurement (GUM)</a>. Joint Committee for Guides in Metrology / BIPM. The uniform (rectangular) distribution is described in section 4.3.7 and the triangular distribution in section 4.3.9. Free to download from the BIPM website.</li>
<li><a href="https://www.gik.kit.edu/downloads/%5BSCHW20%5DGUM_AVN_Teil1.pdf" target="_blank" rel="noopener">Schwarz, W. (2020): Methoden zur Bestimmung der Messunsicherheit nach GUM – Teil 1</a>. avn – Allgemeine Vermessungs-Nachrichten 127(2), 69–86. A German-language summary of the GUM method, including the uniform and triangular distributions (p. 75).</li>
<li><a href="https://www.ttable.org/" target="_blank" rel="noopener">Student's t-distribution table (ttable.org)</a>. Reference table of critical t-values. The app calculates exact two-tailed p-values instead of reading them from a table.</li>
<li><a href="https://eur-lex.europa.eu/eli/dir/2023/970/oj" target="_blank" rel="noopener">Directive (EU) 2023/970 (Pay Transparency Directive)</a>. EUR-Lex. Indicators for gender pay gap reporting (Article 9).</li>
</ol>`

  method_title: "Cómo funciona",
  method_html: `<p>A menudo solo se conoce la <strong>tabla salarial</strong> de una empresa (salario mínimo y máximo de cada nivel) y el <strong>número de mujeres y hombres</strong> en cada nivel. Esta aplicación estima, solo con eso, si el salario difiere según el género.</p>
<ol>
<li><strong>Salario por persona.</strong> Se supone que cada persona de un nivel cobra el punto medio de la banda. La incertidumbre de ese supuesto sigue la GUM (<em>Guía para la expresión de la incertidumbre de medida</em>): σ = anchura de banda / √24 para una distribución triangular, o / √12 para una uniforme.</li>
<li><strong>Salario por grupo y nivel.</strong> N × punto medio, con incertidumbre N × σ (las personas de una misma banda se tratan como totalmente correlacionadas).</li>
<li><strong>Totales.</strong> Se suman los salarios de los niveles y las incertidumbres se combinan en cuadratura: σ<sub>total</sub> = √Σσ²<sub>nivel</sub>.</li>
<li><strong>Pruebas.</strong> Cada diferencia se divide entre su incertidumbre combinada para obtener una t de Student, con grados de libertad = N<sub>mujeres</sub> + N<sub>hombres</sub> − 2. El valor p bilateral es la probabilidad de llegar a una conclusión errónea (error de tipo I); confianza = 1 − p.</li>
<li><strong>Reparto salarial vs plantilla.</strong> Se compara el cociente entre la masa salarial de hombres y mujeres con el cociente de su número. Si los hombres reciben una parte mayor del salario que su parte de la plantilla, cobran más por persona.</li>
<li><strong>Representación por nivel.</strong> En cada nivel, la proporción de mujeres se compara con su proporción en el resto de la plantilla mediante la prueba exacta de Fisher bilateral, fiable incluso con grupos muy pequeños. Como se supone que todas las personas de un nivel cobran el mismo punto medio, esto muestra <em>de dónde</em> viene una brecha en el salario medio: la infrarrepresentación en niveles bien pagados baja la media de las mujeres y la sobrerrepresentación la sube.</li>
<li><strong>Indicadores de transparencia salarial de la UE.</strong> Siguiendo la Directiva de transparencia salarial de la UE (2023/970), la brecha media y la mediana se muestran también respecto al salario de los hombres, junto con la proporción de mujeres en cada cuartil salarial (toda la plantilla ordenada por salario y dividida en cuatro grupos iguales). Se señala una brecha del 5 % o más: a partir de ese nivel la Directiva exige a las empresas justificar o corregir la brecha. Aquí estos valores se estiman a partir de los puntos medios.</li>
</ol>
<h3>Limitaciones</h3>
<ul>
<li>El salario medio es una estimación a partir de los puntos medios: solo puede detectar brechas debidas a cómo se reparten mujeres y hombres entre los niveles, no diferencias dentro de una misma banda.</li>
<li>Los grupos pequeños (menos de ~5 personas) dan resultados poco fiables y pueden permitir identificar a personas.</li>
<li>Que una diferencia sea estadísticamente significativa no prueba discriminación: indica que, con estos supuestos, es poco probable que se deba al azar.</li>
<li>El análisis solo examina el salario. Un fuerte desequilibrio en la plantilla (p. ej., menos de un 30 % de mujeres, una regla habitual de «masa crítica») merece señalarse aunque el salario por persona sea igual. Al grupo infrarrepresentado se le puede pasar por alto o no escuchar, por ejemplo en reuniones y decisiones, y puede sufrir una carga psicológica como estrés, aislamiento o presión para encajar. Los datos salariales no muestran esos efectos.</li>
</ul>

  method_title: "Com funciona",
  method_html: `<p>Sovint només es coneix la <strong>taula salarial</strong> d'una empresa (salari mínim i màxim de cada nivell) i el <strong>nombre de dones i homes</strong> a cada nivell. Aquesta aplicació estima, només amb això, si el salari és diferent segons el gènere.</p>
<ol>
<li><strong>Salari per persona.</strong> Se suposa que cada persona d'un nivell cobra el punt mitjà de la banda. La incertesa d'aquest supòsit segueix la GUM (<em>Guia per a l'expressió de la incertesa de mesura</em>): σ = amplada de banda / √24 per a una distribució triangular, o / √12 per a una uniforme.</li>
<li><strong>Salari per grup i nivell.</strong> N × punt mitjà, amb incertesa N × σ (les persones d'una mateixa banda es tracten com a totalment correlacionades).</li>
<li><strong>Totals.</strong> Se sumen els salaris dels nivells i les incerteses es combinen en quadratura: σ<sub>total</sub> = √Σσ²<sub>nivell</sub>.</li>
<li><strong>Proves.</strong> Cada diferència es divideix per la seva incertesa combinada per obtenir una t de Student, amb graus de llibertat = N<sub>dones</sub> + N<sub>homes</sub> − 2. El valor p bilateral és la probabilitat d'arribar a una conclusió errònia (error de tipus I); confiança = 1 − p.</li>
<li><strong>Repartiment salarial vs plantilla.</strong> Es compara el quocient entre la massa salarial d'homes i dones amb el quocient del seu nombre. Si els homes reben una part del salari més gran que la seva part de la plantilla, cobren més per persona.</li>
<li><strong>Representació per nivell.</strong> A cada nivell, la proporció de dones es compara amb la seva proporció en la resta de la plantilla amb la prova exacta de Fisher bilateral, fiable fins i tot amb grups molt petits. Com que se suposa que totes les persones d'un nivell cobren el mateix punt mitjà, això mostra <em>d'on</em> ve una bretxa en el salari mitjà: la infrarepresentació en nivells ben pagats abaixa la mitjana de les dones i la sobrerepresentació l'apuja.</li>
<li><strong>Indicadors de transparència salarial de la UE.</strong> Seguint la Directiva de transparència salarial de la UE (2023/970), la bretxa mitjana i la mediana també es mostren respecte al salari dels homes, juntament amb la proporció de dones a cada quartil salarial (tota la plantilla ordenada per salari i dividida en quatre grups iguals). Es marca una bretxa del 5 % o més: a partir d'aquest nivell la Directiva exigeix a les empreses justificar o corregir la bretxa. Aquí aquests valors s'estimen a partir dels punts mitjans.</li>
</ol>
<h3>Limitacions</h3>
<ul>
<li>El salari mitjà és una estimació a partir dels punts mitjans: només pot detectar bretxes degudes a com es reparteixen dones i homes entre els nivells, no diferències dins d'una mateixa banda.</li>
<li>Els grups petits (menys de ~5 persones) donen resultats poc fiables i poden permetre identificar persones.</li>
<li>Que una diferència sigui estadísticament significativa no prova discriminació: indica que, amb aquests supòsits, és poc probable que sigui fruit de l'atzar.</li>
<li>L'anàlisi només examina el salari. Un fort desequilibri a la plantilla (p. ex., menys d'un 30 % de dones, una regla habitual de «massa crítica») val la pena assenyalar-lo encara que el salari per persona sigui igual. El grup infrarepresentat pot passar desapercebut o no ser escoltat, per exemple en reunions i decisions, i pot patir una càrrega psicològica com estrès, aïllament o pressió per encaixar. Les dades salarials no mostren aquests efectes.</li>
</ul>
<h3>Fonts</h3>
<ol class="src">
<li><a href="https://doi.org/10.59161/JCGM100-2008E" target="_blank" rel="noopener">JCGM 100:2008 — Evaluation of measurement data: Guide to the expression of uncertainty in measurement (GUM)</a>. Joint Committee for Guides in Metrology / BIPM. La distribució uniforme (rectangular) es descriu a l'apartat 4.3.7 i la triangular al 4.3.9. Descàrrega gratuïta al web del BIPM.</li>
<li><a href="https://www.gik.kit.edu/downloads/%5BSCHW20%5DGUM_AVN_Teil1.pdf" target="_blank" rel="noopener">Schwarz, W. (2020): Methoden zur Bestimmung der Messunsicherheit nach GUM – Teil 1</a>. avn – Allgemeine Vermessungs-Nachrichten 127(2), 69–86. Resum en alemany del mètode GUM, amb les distribucions uniforme i triangular (p. 75).</li>
<li><a href="https://www.ttable.org/" target="_blank" rel="noopener">Student's t-distribution table (ttable.org)</a>. Taula de referència de valors crítics de t. L'aplicació calcula valors p bilaterals exactes en lloc de llegir-los d'una taula.</li>
<li><a href="https://eur-lex.europa.eu/eli/dir/2023/970/oj" target="_blank" rel="noopener">Directive (EU) 2023/970 (Pay Transparency Directive)</a>. EUR-Lex. Indicadors per informar sobre la bretxa salarial de gènere (article 9).</li>
</ol>`

  copy_table: "Tabelle kopieren", copied: "Kopiert", download: "Herunterladen",
  whatif: "Was-wäre-wenn",
  whatif_d: "Ändern Sie die Zahlen, um zu sehen, wie sich die Lücke verändern würde, z. B. wenn Frauen in höhere Stufen befördert werden. Ihre Daten ändern sich erst, wenn Sie übernehmen.",

  method_html: `<p>Oft sind von einem Unternehmen nur die <strong>Gehaltstabelle</strong> (Mindest- und Höchstgehalt je Stufe) und die <strong>Anzahl der Frauen und Männer</strong> je Stufe bekannt. Diese App schätzt allein daraus, ob sich die Bezahlung nach Geschlecht unterscheidet.</p>
<ol>
<li><strong>Gehalt pro Person.</strong> Für alle Personen einer Stufe wird die Bandmitte angenommen. Die Unsicherheit dieser Annahme folgt dem GUM (<em>Leitfaden zur Angabe der Unsicherheit beim Messen</em>): σ = Bandbreite / √24 bei Dreiecksverteilung bzw. / √12 bei Gleichverteilung.</li>
<li><strong>Gehalt pro Gruppe und Stufe.</strong> N × Bandmitte, mit Unsicherheit N × σ. Personen im selben Band gelten als vollständig korreliert.</li>
<li><strong>Summen.</strong> Die Gehälter werden über die Stufen addiert, die Unsicherheiten quadratisch kombiniert: σ<sub>gesamt</sub> = √Σσ²<sub>Stufe</sub>.</li>
<li><strong>Tests.</strong> Jeder Unterschied wird durch seine kombinierte Unsicherheit geteilt. Das ergibt einen Student-t-Wert mit Freiheitsgraden = N<sub>Frauen</sub> + N<sub>Männer</sub> − 2. Der zweiseitige p-Wert ist die Wahrscheinlichkeit eines Fehlschlusses (Fehler 1. Art). Konfidenz = 1 − p.</li>
<li><strong>Gehaltsanteil vs. Personalanteil.</strong> Das Verhältnis der Gesamtvergütung von Männern zu Frauen wird mit dem Verhältnis ihrer Personalzahlen verglichen. Ist der Gehaltsanteil der Männer größer als ihr Personalanteil, verdienen sie pro Kopf mehr.</li>
<li><strong>Vertretung nach Stufe.</strong> Für jede Stufe wird der Frauenanteil mit ihrem Anteil am übrigen Personal verglichen, mit dem zweiseitigen exakten Test nach Fisher, der auch bei sehr kleinen Gruppen zuverlässig ist. Da für alle Personen einer Stufe dieselbe Bandmitte angenommen wird, zeigt dies, <em>woher</em> eine Lücke beim Durchschnittsgehalt kommt: Unterrepräsentation in gut bezahlten Stufen senkt den Durchschnitt der Frauen, Überrepräsentation hebt ihn.</li>
<li><strong>EU-Indikatoren zur Entgelttransparenz.</strong> Nach der EU-Entgelttransparenzrichtlinie (2023/970) werden die mittlere und die Median-Lücke zusätzlich relativ zum Gehalt der Männer gezeigt, zusammen mit dem Frauenanteil in jedem Gehaltsquartil (das gesamte Personal nach Gehalt sortiert und in vier gleich große Gruppen geteilt). Eine Lücke von 5 % oder mehr wird markiert: Ab dieser Höhe verlangt die Richtlinie, dass Arbeitgeber die Lücke begründen oder beheben. Hier werden diese Werte aus den Bandmitten geschätzt.</li>
</ol>
<h3>Grenzen</h3>
<ul>
<li>Das Durchschnittsgehalt ist eine Schätzung auf Basis der Bandmitten. Es zeigt nur Lücken, die durch die Verteilung von Frauen und Männern auf die Stufen entstehen, nicht Unterschiede innerhalb eines Bandes.</li>
<li>Kleine Gruppen (unter ~5 Personen) liefern unzuverlässige Ergebnisse und können einzelne Personen erkennbar machen.</li>
<li>Statistische Signifikanz ist kein Beweis für Diskriminierung. Sie zeigt nur, dass der Unterschied unter diesen Annahmen wahrscheinlich nicht zufällig ist.</li>
<li>Die Analyse betrachtet nur das Gehalt. Ein starkes Ungleichgewicht beim Personal (z. B. weniger als etwa 30 % Frauen, eine gängige Faustregel für eine „kritische Masse“) ist auch bei gleichem Gehalt pro Person erwähnenswert. Die unterrepräsentierte Gruppe kann leichter übersehen oder nicht gehört werden, etwa in Besprechungen und bei Entscheidungen, und psychisch belastet sein, z. B. durch Stress, Isolation oder Anpassungsdruck. Gehaltsdaten zeigen solche Effekte nicht.</li>
</ul>
<h3>Quellen</h3>
<ol class="src">
<li><a href="https://doi.org/10.59161/JCGM100-2008E" target="_blank" rel="noopener">JCGM 100:2008 — Evaluation of measurement data: Guide to the expression of uncertainty in measurement (GUM)</a>. Joint Committee for Guides in Metrology / BIPM. Die Gleich- (Rechteck-)verteilung wird in Abschnitt 4.3.7 beschrieben, die Dreiecksverteilung in Abschnitt 4.3.9. Kostenloser Download auf der Website des BIPM.</li>
<li><a href="https://www.gik.kit.edu/downloads/%5BSCHW20%5DGUM_AVN_Teil1.pdf" target="_blank" rel="noopener">Schwarz, W. (2020): Methoden zur Bestimmung der Messunsicherheit nach GUM – Teil 1</a>. avn – Allgemeine Vermessungs-Nachrichten 127(2), 69–86. Deutschsprachige Zusammenfassung der GUM-Methode, einschließlich Gleich- und Dreiecksverteilung (S. 75).</li>
<li><a href="https://www.ttable.org/" target="_blank" rel="noopener">Student's t-distribution table (ttable.org)</a>. Referenztabelle kritischer t-Werte. Die App berechnet exakte zweiseitige p-Werte, statt sie aus einer Tabelle abzulesen.</li>
<li><a href="https://eur-lex.europa.eu/eli/dir/2023/970/oj" target="_blank" rel="noopener">Directive (EU) 2023/970 (Pay Transparency Directive)</a>. EUR-Lex. Indikatoren für die Berichterstattung über das geschlechtsspezifische Entgeltgefälle (Artikel 9).</li>
</ol>`

<script>(() => {
const STORE = "paygap-estimator-v1";
const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- state ----------
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
function example() {

      { name: lv(2), min: 34000, max: 46000, mid: "" },
      { name: lv(3), min: 43000, max: 57000, mid: "" },
      { name: lv(4), min: 55000, max: 70000, mid: "" },
      { name: lv(5), min: 70000, max: 90000, mid: "" }],
    depts: [
      { name: T.ex_depts[0], w: [180, 160, 110, 40, 12, 3], m: [150, 170, 180, 140, 85, 40] },
      { name: T.ex_depts[1], w: [520, 140, 60, 25, 10, 4], m: [110, 150, 190, 120, 60, 25] },
      { name: T.ex_depts[2], w: [120, 210, 280, 60, 22, 8], m: [125, 205, 285, 58, 23, 8] },
      { name: T.ex_depts[3], w: [20, 30, 40, 10, 3, 1], m: [120, 180, 240, 60, 18, 6] },
      { name: T.ex_depts[4], w: [400, 80, 15, 3, 1, 0], m: [60, 120, 200, 180, 120, 60] }],
    active: 0
  };
}
function blank() {
  return { v: 1, lang: state.lang, org: "", year: new Date().getFullYear(), currency: "EUR",
    distribution: "triangular", reference: "mean", thresholds: [0.99, 0.95, 0.90],
    levels: [0, 1, 2].map(i => ({ name: tr("level") + " " + ROMAN[i], min: "", max: "", mid: "" })),
    depts: [{ name: tr("new_dept"), w: [0, 0, 0], m: [0, 0, 0] }], active: 0 };
}
function detectLang() {
  const l = (navigator.language || "en").toLowerCase();
  return l.startsWith("ca") ? "ca" : l.startsWith("es") ? "es" : l.startsWith("de") ? "de" : "en";
}
let state = null;
try { const s = JSON.parse(localStorage.getItem(STORE)); if (valid(s)) state = s; } catch (e) {}
// Replace the first version's four-level example (R1-R4) with the current example
if (state && state.levels.map(l => l.name).join() === "R1,R2,R3,R4") state = null;
if (!state) state = example();
function valid(s) { return s && Array.isArray(s.levels) && Array.isArray(s.depts) && s.depts.every(d => Array.isArray(d.w) && Array.isArray(d.m)); }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function normalize() {
  const n = state.levels.length;
  state.depts.forEach(d => { while (d.w.length < n) d.w.push(0); while (d.m.length < n) d.m.push(0); d.w.length = n; d.m.length = n; });
  if (!(state.active >= 0 && state.active < state.depts.length)) state.active = 0;
}
normalize();

// ---------- i18n & formatting ----------
const tr = (k, vars) => {
  let s = (I18N[state.lang] && I18N[state.lang][k]) ?? I18N.en[k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split("{" + a + "}").join(b);
  return s;
};
const loc = () => I18N[state.lang].locale;
const money = v => {
  if (v == null || !isFinite(v)) return "–";
  try { return new Intl.NumberFormat(loc(), { style: "currency", currency: state.currency || "EUR", maximumFractionDigits: 0 }).format(v); }
  catch (e) { return new Intl.NumberFormat(loc(), { maximumFractionDigits: 0 }).format(v) + " " + (state.currency || ""); }
};
const num = (v, d = 0) => v == null || !isFinite(v) ? "–" : new Intl.NumberFormat(loc(), { maximumFractionDigits: d, minimumFractionDigits: d }).format(v);
const pct = (v, d = 1) => v == null || !isFinite(v) ? "–" : new Intl.NumberFormat(loc(), { style: "percent", maximumFractionDigits: d, minimumFractionDigits: d }).format(v);
const conf = c => {
  if (c == null || !isFinite(c)) return "–";
  if (c >= 0.9999) return ">" + pct(0.9999, 2);
  // truncate (never round up across a threshold, e.g. 98.996% -> 98.99%)
  const d = c >= 0.9 ? 2 : 1, f = Math.pow(10, d + 2);
  return pct(Math.floor(c * f) / f, d);
};
const badge = l => `<span class="badge ${l === "n/a" ? "na" : l}">${esc(tr("lab_" + l))}</span>`;
const opts = () => ({ distribution: state.distribution, reference: state.reference, thresholds: state.thresholds });
const analyzeDept = d => PayGap.analyze(state.levels, d.w, d.m, opts());

// ---------- routing ----------
const TABS = ["setup", "bands", "staff", "results", "method"];
const current = () => { const h = location.hash.slice(1); return TABS.includes(h) ? h : "results"; };
window.addEventListener("hashchange", render);

// ---------- render ----------
function render() {
  document.documentElement.lang = state.lang;
  document.title = tr("app_title");
  const tab = current();
  $("#app").innerHTML = `
  <header class="top">
    <div><h1>${esc(tr("app_title"))}</h1><p class="sub">${esc(tr("app_sub"))}</p></div>

      ${["en", "es", "ca", "de"].map(l => `<button data-lang="${l}" aria-pressed="${state.lang === l}">${{ en: "English", es: "Español", ca: "Català", de: "Deutsch" }[l]}</button>`).join("")}
    </div>
  </header>
  <nav class="tabs">${TABS.map(t => `<a href="#${t}" ${t === tab ? 'aria-current="page"' : ""}>${esc(tr("tab_" + t))}</a>`).join("")}</nav>

  <p class="foot">${esc(tr("data_note"))}</p>`;
  ({ setup: viewSetup, bands: viewBands, staff: viewStaff, results: viewResults, method: viewMethod })[tab]($("#view"));
}

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]");
  if (l) { relabelExample(l.dataset.lang); state.lang = l.dataset.lang; save(); render(); }
});

// Keep untouched example names in the chosen language
function relabelExample(to) {
  const langs = Object.keys(I18N), T = I18N[to];
  if (langs.some(l => I18N[l].ex_company === state.org)) state.org = T.ex_company;
  state.depts.forEach(d => {
    for (const l of langs) {
      const k = I18N[l].ex_depts.indexOf(d.name);
      if (k >= 0) { d.name = T.ex_depts[k]; break; }
      const m = d.name.match(new RegExp("^" + I18N[l].ex_dept.replace("{x}", "([A-Z])") + "$"));
      if (m) { d.name = T.ex_dept.replace("{x}", m[1]); break; }
    }
  });
  state.levels.forEach(lv => {
    for (const l of langs) {
      const m = lv.name.match(new RegExp("^" + I18N[l].level + " ([IVX]+)$"));
      if (m) { lv.name = T.level + " " + m[1]; break; }
    }
  });
}

// ---------- 1. setup ----------
function viewSetup(v) {
  v.innerHTML = `
  <section class="card"><h2>${esc(tr("setup_title"))}</h2>
    <div class="grid2">
      <label class="f">${esc(tr("org"))}<input id="org" value="${esc(state.org)}"></label>

  $("#bl").onclick = () => confirmBox(() => { state = blank(); normalize(); save(); location.hash = "bands"; render(); });

}

// ---------- 2. bands ----------
function bandProblems() {
  const p = {};
  state.levels.forEach((l, i) => {
    if (l.min !== "" && l.max !== "" && +l.max <= +l.min) p[i] = tr("err_minmax");

}

  </section>`;
  const warn = () => {
    const p = bandProblems();
    v.querySelectorAll("tbody tr").forEach(tr_ => {
      const i = +tr_.dataset.i, bad = !!p[i];
      tr_.querySelector("[data-k=max]").classList.toggle("bad", bad);
    });
    $("#bandwarn").innerHTML = Object.entries(p).map(([i, m]) => `<div class="warn">${esc(state.levels[i].name)}: ${esc(m)}</div>`).join("");
  };
  warn();
  v.querySelectorAll("tbody input").forEach(inp => inp.oninput = () => {
    const i = +inp.closest("tr").dataset.i, k = inp.dataset.k;
    const l = state.levels[i];
    l[k] = k === "name" ? inp.value : (inp.value === "" ? "" : +inp.value);
    if (k === "mid" && inp.value === "") l.mid = "";
    const row = inp.closest("tr");
    row.querySelector(".w").textContent = l.min !== "" && l.max !== "" ? num(+l.max - +l.min) : "–";
    row.querySelector("[data-k=mid]").placeholder = tr("auto") + ": " + (l.min !== "" && l.max !== "" ? num((+l.min + +l.max) / 2) : "");
    save(); warn();
  });
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const i = +b.dataset.del;
    state.levels.splice(i, 1);
    state.depts.forEach(d => { d.w.splice(i, 1); d.m.splice(i, 1); });
    save(); render();
  });
  $("#add").onclick = () => {
    const last = state.levels[state.levels.length - 1];
    state.levels.push({ name: tr("level") + " " + (ROMAN[state.levels.length] || state.levels.length + 1), min: last && last.max !== "" ? last.max : "", max: "", mid: "" });
    normalize(); save(); render();
  };
  $("#doPaste").onclick = () => {
    const rows = $("#paste").value.split(/\r?\n/).map(r => r.split(/\t|;|,(?=\s*\d)/).map(c => c.trim())).filter(r => r.length >= 3);
    const parseN = s => { s = s.replace(/[^\d.,-]/g, ""); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, ""); return parseFloat(s); };
    const lv = rows.map(r => ({ name: r[0], min: parseN(r[1]), max: parseN(r[2]), mid: r[3] ? parseN(r[3]) : "" }))
      .filter(l => isFinite(l.min) && isFinite(l.max));
    if (!lv.length) return;
    lv.forEach(l => { if (!isFinite(l.mid)) l.mid = ""; });
    state.levels = lv; normalize(); save(); render();
  };
}

function verdictHTML(r) {
  const m = r.mean, parts = [];
  const same = Math.abs(m.diff) < 0.5;
  if (same) parts.push(tr("v_equal"));
  else parts.push(tr(m.diff < 0 ? "v_lower" : "v_higher", { pct: pct(Math.abs(m.rel)) }));
  if (same) { /* nothing to test */ } else if (m.label === "HiSig" || m.label === "Sig") parts.push(tr("v_sig", { label: tr("lab_" + m.label), conf: conf(m.confidence) }));
  else if (m.label === "MidSig") parts.push(tr("v_mid", { conf: conf(m.confidence) }));
  else if (m.label === "NotSig") parts.push(tr("v_not", { conf: conf(m.confidence) }));
  let html = `<p><strong>${esc(parts[0])}</strong> ${esc(parts.slice(1).join(" "))}</p>`;
  // significant under/over-representation by level
  const sig = l => l.label === "HiSig" || l.label === "Sig";
  const list = rep => r.levels.filter(l => sig(l) && l.representation === rep).map(l => `${l.level} (${pct(l.share_women, 0)})`).join(", ");
  const under = list("under"), over = list("over");
  const reps = [];
  if (under) reps.push(tr("v_under", { levels: under }));
  if (over) reps.push(tr("v_over", { levels: over }));
  if (reps.length) html += `<p>${esc(tr("v_rep_intro", { a: pct(r.women / (r.women + r.men), 0) }))} ${esc(reps.join(" "))}</p>`;
  // strong headcount imbalance: pay data can't show its other effects
  const wShare = r.women / (r.women + r.men);
  if (wShare < 0.3) html += `<p class="note">${esc(tr("v_min_w", { a: pct(wShare, 0), r: num(r.men / r.women, 1) }))}</p>`;
  else if (wShare > 0.7) html += `<p class="note">${esc(tr("v_min_m", { a: pct(1 - wShare, 0), r: num(r.women / r.men, 1) }))}</p>`;
  if (r.men !== r.women && Math.abs(r.total.rel) > Math.abs(m.rel) + 0.02) html += `<p class="help" style="margin:0">${esc(tr("v_total", { pct: pct(Math.abs(r.total.rel)), r: num(Math.max(r.men, r.women) / Math.min(r.men, r.women), 1) }))}</p>`;
  return html;
}
function favours(diff, lbl) { return lbl === "n/a" ? "–" : Math.abs(diff) < 0.5 ? tr("fav_parity") : tr(diff > 0 ? "fav_women" : "fav_men"); }
function testCard(title, desc, big, sub, t, extra) {
  return `<div class="card test" style="margin:0"><h3>${esc(title)}</h3><p class="d">${esc(desc)}</p>
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="big num">${big}</div><div class="help" style="margin:2px 0 0">${sub}</div></div>${badge(t.label)}</div>
    <dl class="kv">${extra}<dt>${esc(tr("conf"))}</dt><dd>${conf(t.confidence)}</dd><dt>${esc(tr("tscore"))} · ${esc(tr("dof"))}</dt><dd>${num(t.t, 2)} · ${num(t.dof)}</dd></dl></div>`;
}

    <div class="tbl-scroll"><table id="lvlTbl"><thead><tr><th>${esc(tr("level"))}</th><th class="n">${esc(tr("women"))}</th><th class="n">${esc(tr("men"))}</th><th class="n">${esc(tr("pay_pp"))}</th><th class="n">${esc(tr("w_share"))}</th><th class="n">${esc(tr("vs_all"))}</th><th class="n">${esc(tr("conf"))}</th><th>${esc(tr("women_are"))}</th><th></th></tr></thead>

    ${warns.length ? warns.map(w => `<div class="warn">${esc(w)}</div>`).join("") : ""}

// ---------- what-if ----------
function renderWhatIf(el, idx) {
  const d = state.depts[idx];
  if (!scenario || scenario.idx !== idx) scenario = { idx, w: [...d.w], m: [...d.m] };
  const base = analyzeDept(d);
  const draw = () => {
    const s = PayGap.analyze(state.levels, scenario.w, scenario.m, opts());
    const block = (title, r) => r.error ? `<div><div class="help">${esc(title)}</div>–</div>` :
      `<div class="card" style="margin:0;padding:12px 14px"><div class="help" style="margin:0">${esc(title)} · ${esc(tr("t_mean"))}</div><div class="big num">${(r.mean.rel > 0 ? "+" : "") + pct(r.mean.rel)}</div><div style="margin-top:6px">${badge(r.mean.label)} <span class="help">${conf(r.mean.confidence)}</span></div></div>`;
    $("#wiCmp").innerHTML = block(tr("baseline"), base) + block(tr("scenario"), s);
    el.querySelectorAll("[data-wi]").forEach(inp => {
      const [g, i] = inp.dataset.wi.split(":"); const delta = scenario[g][+i] - (+d[g][+i] || 0);
      inp.closest("td").querySelector(".delta").textContent = delta ? (delta > 0 ? "+" : "") + delta : "";
    });
  };
  const stepper = (g, i) => `<span class="stepper"><button data-st="${g}:${i}:-1" aria-label="−">−</button><input type="number" min="0" data-wi="${g}:${i}" value="${scenario[g][i]}" aria-label="${esc(tr(g === "w" ? "women" : "men") + " " + state.levels[i].name)}"><button data-st="${g}:${i}:1" aria-label="+">+</button></span><span class="delta"></span>`;
  el.innerHTML = `<h2>${esc(tr("whatif"))}</h2><p class="help">${esc(tr("whatif_d"))}</p>
    <div class="cmp" id="wiCmp"></div>
    <div class="tbl-scroll"><table><thead><tr><th>${esc(tr("level"))}</th><th>${esc(tr("women"))}</th><th>${esc(tr("men"))}</th></tr></thead>
    <tbody>${state.levels.map((l, i) => `<tr><td>${esc(l.name)}</td><td>${stepper("w", i)}</td><td>${stepper("m", i)}</td></tr>`).join("")}</tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="b" id="wiReset">${esc(tr("reset"))}</button><button class="b" id="wiApply">${esc(tr("apply_dept"))}</button><button class="b primary" id="wiNew">${esc(tr("save_new"))}</button></div>`;
  el.querySelectorAll("[data-wi]").forEach(inp => inp.oninput = () => { const [g, i] = inp.dataset.wi.split(":"); scenario[g][+i] = Math.max(0, Math.round(+inp.value || 0)); draw(); });
  el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
    const [g, i, s] = b.dataset.st.split(":"); scenario[g][+i] = Math.max(0, scenario[g][+i] + +s);
    el.querySelector(`[data-wi="${g}:${i}"]`).value = scenario[g][+i]; draw();
  });
  $("#wiReset").onclick = () => { scenario = null; renderWhatIf(el, idx); };
  $("#wiApply").onclick = () => { d.w = [...scenario.w]; d.m = [...scenario.m]; scenario = null; save(); render(); };
  $("#wiNew").onclick = () => { state.depts.push({ name: tr("scenario_name", { name: d.name }), w: [...scenario.w], m: [...scenario.m] }); state.active = state.depts.length - 1; scenario = null; save(); render(); };
  draw();
}

const tip = (() => { const t = document.createElement("div"); t.className = "tip"; document.body.appendChild(t); return t; })();
function bindTips(svg) {
  svg.querySelectorAll("[data-tip]").forEach(n => {
    n.addEventListener("pointermove", e => { tip.innerHTML = n.dataset.tip; tip.style.display = "block";
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = (e.clientY + 14) + "px"; });
    n.addEventListener("pointerleave", () => tip.style.display = "none");
  });

function tableButtons(el, rowsFn, fname) {

function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = tr("copied") + " ✓"; setTimeout(() => btn.textContent = o, 1400); } };
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } catch (e) { fallbackCopy(text, done); }
}

// Downloads: a normal download on GitHub/GitLab; on the Claude page through its downloads capability
let _canDl = null;
function canDownload() {

  grid: "#e1e0d9", axis: "#c3c2b7", muted: "#898781", ink: "#0b0b0b", ink2: "#52514e",

// --- turn an on-screen chart into a PNG (light colours, fixed fonts) ---
function svgToPng(svg, scale = 2) {
  let src = svg.outerHTML
    .replace(/var\(--([a-z0-9]+)\)/g, (m, k) => LIGHT[k] || "#888")
    .replace(/ data-tip="[^"]*"/g, "")
    .replace(/&nbsp;/g, "&#160;"); // HTML entity is not valid in an SVG image

  const vb = svg.getAttribute("viewBox").split(/\s+/).map(Number), w = vb[2], h = vb[3];
  src = src.replace(/<svg([^>]*)>/, (m, a) => `<svg${a.replace(/\s(width|height)="[^"]*"/g, "")} width="${w}" height="${h}"><style>text{fill:${LIGHT.muted};font-family:Arial,Helvetica,sans-serif;font-size:11px}.lbl{fill:${LIGHT.ink2};font-size:12px}</style><rect width="100%" height="100%" fill="#ffffff"/>`);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const ctx = c.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL("image/png");
      const bin = atob(dataUrl.split(",")[1]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      resolve({ dataUrl, bytes, w, h });
    };
    img.onerror = reject;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
  });
}
// render a chart function off-screen at report width and return its PNG

  const host = document.createElement("div");
  host.style.cssText = `position:absolute;left:-10000px;top:0;width:${REPORT_W}px`;
  document.body.appendChild(host);
  try { fn(host, ...args); const svg = host.querySelector("svg"); return svg ? await svgToPng(svg) : null; }
  finally { host.remove(); }
}
// heatmap as SVG (the on-screen one is HTML)
function heatSvg(el, items) {
  const n = state.levels.length, W = REPORT_W, lab = 170, cw = (W - lab) / n, rh = 34, T = 22, H = T + rh * items.length + 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  state.levels.forEach((l, i) => s += `<text x="${lab + cw * i + cw / 2}" y="14" text-anchor="middle">${esc(l.name.replace(/^\S+\s+(?=[IVX]+$)/, ""))}</text>`);
  items.forEach(({ name, r }, j) => {
    const y = T + rh * j;
    s += `<text class="lbl" x="0" y="${y + rh / 2}">${esc(name.length > 26 ? name.slice(0, 25) + "…" : name)}</text>`;
    r.levels.forEach((l, i) => {
      const x = lab + cw * i;
      let fill = LIGHT.hover, tc = LIGHT.muted, txt = "–";
      if (l.share_diff != null) {
        const pp = l.share_diff * 100, a = Math.abs(pp), rd = Math.round(pp), sig = l.label === "HiSig" || l.label === "Sig";
        txt = (rd > 0 ? "+" : rd < 0 ? "−" : "") + Math.abs(rd);

// --- HTML (from the app's own text) to report paragraphs ---
function htmlToBlocks(html) {
  const d = document.createElement("div"); d.innerHTML = html;
  const out = [];
  const runs = node => {
    const rs = [];
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) rs.push({ text: c.textContent });
      else if (c.tagName === "STRONG" || c.tagName === "B") rs.push({ text: c.textContent, b: true });
      else if (c.tagName === "EM" || c.tagName === "I") rs.push({ text: c.textContent, i: true });
      else if (c.tagName === "A") rs.push({ text: c.textContent }, { text: " (" + c.getAttribute("href") + ")", color: LIGHT.ink2 });
      else if (c.tagName === "SUB") rs.push({ text: c.textContent });
      else rs.push(...runs(c));
    });
    return rs;
  };
  d.childNodes.forEach(c => {
    if (c.nodeType !== 1) return;
    if (c.tagName === "H3") out.push({ t: "h3", text: c.textContent });
    else if (c.tagName === "P") out.push({ t: "p", runs: runs(c), cls: c.className });
    else if (c.tagName === "OL" || c.tagName === "UL") [...c.children].forEach((li, i) =>
      out.push({ t: "p", runs: [{ text: (c.tagName === "OL" ? (i + 1) + ". " : "• ") }, ...runs(li)], indent: true }));
  });
  return out;
}

<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;

<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:sz w:val="25"/></w:rPr></w:style>

  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;

// --- print layout (Save as PDF) ---
function toPrintHTML(blocks) {
  // keep each heading together with the chart or table that follows it
  const out = []; let grp = null;
  const flush = () => { if (grp) { out.push(`<section class="rg">${grp.join("\n")}</section>`); grp = null; } };
  blocks.forEach(b => {
    const h = blockHTML(b);
    if (b.t === "h2") { flush(); grp = [h]; return; }
    if (grp) { grp.push(h); if (b.t === "img" || b.t === "table") flush(); return; }
    out.push(h);
  });
  flush();
  return out.join("\n");
}
function blockHTML(b) {
  const run = r => { const t = esc(r.text); const st = r.color ? ` style="color:${r.color}"` : ""; return r.b ? `<strong${st}>${t}</strong>` : r.i ? `<em${st}>${t}</em>` : st ? `<span${st}>${t}</span>` : t; };
  {
    if (b.t === "title") return `<h1 class="rt">${esc(b.text)}</h1>`;
    if (b.t === "h1") return `<h2 class="r1">${esc(b.text)}</h2>`;
    if (b.t === "h2") return `<h3 class="r2">${esc(b.text)}</h3>`;
    if (b.t === "h3") return `<h4 class="r3">${esc(b.text)}</h4>`;
    if (b.t === "p") return `<p class="${b.indent ? "ri" : ""}${b.note ? " rn" : ""}">${b.runs.map(run).join("")}</p>`;
    if (b.t === "legend") return `<p class="rl">${b.items.map(it => `<span><i style="background:${it.color}"></i>${esc(it.text)}</span>`).join("")}</p>`;
    if (b.t === "pagebreak") return `<div class="rpb"></div>`;
    if (b.t === "img") return b.dataUrl ? `<img class="rimg" src="${b.dataUrl}" style="width:${Math.min(b.w, 640)}px">` : "";
    if (b.t === "table") return `<table class="rtab"><thead><tr>${b.head.map((h, i) => `<th class="${b.align && b.align[i] === "r" ? "n" : ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => `<td class="${b.align && b.align[i] === "r" ? "n" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    return "";
  }
}

// --- saving a file (Claude page: downloads capability; elsewhere: normal download) ---
async function saveFile(name, bytes, type) {
  if (FRAMED && window.claude && window.claude.use) {
    const dl = await window.claude.use("downloads");
    if (!dl) throw new Error("unavailable");
    await dl.save({ filename: name, data: bytes });
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([bytes], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const reportName = ext => ((tr("rep_file") + "-" + (state.org || "") + "-" + (state.year || "")).replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "report") + "." + ext;

async function downloadDocx(btn, status) {
  btn.disabled = true; status.textContent = tr("rep_making");
  try {
    const blocks = await buildReport();
    await saveFile(reportName("docx"), toDocx(blocks), "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    status.textContent = "";
  } catch (e) { status.textContent = e && e.code === "declined" ? "" : tr("rep_fail"); console.error(e); }
  btn.disabled = false;
}
async function printPdf(btn, status) {
  btn.disabled = true; status.textContent = tr("rep_making");
  try {
    const blocks = await buildReport();
    let root = document.getElementById("print-root");
    if (!root) { root = document.createElement("div"); root.id = "print-root"; document.body.appendChild(root); }
    root.innerHTML = toPrintHTML(blocks);
    const imgs = [...root.querySelectorAll("img")];
    await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    status.textContent = tr("rep_pdf_hint");
    const old = document.title; document.title = reportName("pdf").replace(/\.pdf$/, "");
    window.print();
    document.title = old;
  } catch (e) { status.textContent = tr("rep_fail"); console.error(e); }
  btn.disabled = false;
}
function reportButtons(el) {
  el.innerHTML = `<span class="muted" style="font-size:13px">${esc(tr("rep_btn"))}:</span>
    ${FRAMED ? "" : `<button class="b" data-r="pdf">PDF</button>`}
    <button class="b" data-r="docx">Word (.docx)</button>
    <span class="muted" style="font-size:12px" data-r="st"></span>`;
  const st = el.querySelector("[data-r=st]");
  const p = el.querySelector("[data-r=pdf]"); if (p) p.onclick = () => printPdf(p, st);
  const d = el.querySelector("[data-r=docx]"); d.onclick = () => downloadDocx(d, st);
  canDownload().then(ok => { d.hidden = !ok; });
}


render();
})();
